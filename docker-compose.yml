version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - opensec-data:/app/data
    environment:
      - OPENSEC_DATABASE_URL=sqlite+aiosqlite:///./data/opensec.db
      - OPENSEC_EDGAR_USER_AGENT=OpenSEC/1.0 (your-email@example.com)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  opensec-data:
